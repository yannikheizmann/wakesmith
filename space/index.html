<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Say "yambo" — wakesmith demo</title>
  <style>
    body {
      margin: 0; background: #fffdf8; color: #2a0000;
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 480px; margin: 0 auto; padding: 2rem 1.5rem;
      display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center;
    }
    img { width: 100%; border-radius: 12px; }
    h1 { font-size: 2.2rem; margin: 0.5rem 0 0; }
    h1 span { color: #da8c8c; transition: color 0.2s; }
    main.detected h1 span { color: #2a0000; }
    button {
      background: #2a0000; color: #ffeaa5; border: 0; border-radius: 8px;
      font-size: 1rem; font-weight: 700; padding: 0.8rem 2rem; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .bar { width: 100%; height: 6px; background: #f0e6dc; border-radius: 3px; overflow: hidden; }
    .bar div { height: 100%; width: 0; background: #da8c8c; transition: width 80ms linear; }
    #progress { display: none; }
    .score { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .muted { color: #8a6f6f; font-size: 0.85rem; }
    a { color: #2a0000; }
  </style>
</head>
<body>
  <main id="wake-demo">
    <img src="banner.svg" alt="wakesmith">
    <h1>Say <span>“yambo”</span></h1>
    <button id="wake-demo-start" type="button">Download model</button>
    <div class="bar" id="progress"><div id="wake-demo-progress-bar"></div></div>
    <div class="bar"><div id="wake-demo-bar"></div></div>
    <div class="score" id="wake-demo-score">0.000</div>
    <div>detections: <strong id="wake-demo-count">0</strong></div>
    <div class="muted" id="wake-demo-status">Runs entirely in your browser — nothing is recorded.</div>
    <div class="muted">Trained with <a href="https://github.com/yannikheizmann/wakesmith">wakesmith</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="wake-demo.js?v=4"></script>
</body>
</html>
