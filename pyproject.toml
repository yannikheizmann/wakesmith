[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wakesmith"
version = "0.1.0"
description = "Train a custom openWakeWord-compatible wake-word model with one command"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yannik Heizmann", email = "research@yannikheizmann.com" }]
keywords = [
    "wake-word",
    "keyword-spotting",
    "openwakeword",
    "speech",
    "synthetic-data",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Training head, Piper VITS wrapper and CMUdict neighbours (Apache-2.0).
    "livekit-wakeword[train,export]==0.3.0",
    # Feature front end and streaming runtime the exported models target.
    "openwakeword==0.6.0",
    "onnxruntime==1.20.1",
    "numpy>=1.26,<2",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchcodec==0.5",
    "kokoro==0.9.4",
    "en-core-web-sm==3.8.0",
    "voxcpm==2.0.3",
    "transformers>=4.57",
    "pyarrow>=14,<17",
    "pydantic>=2.10",
    "rapidfuzz>=3.9",
    "rich>=13.9",
    "typer>=0.15",
    "wordfreq>=3.1",
]

[project.urls]
Documentation = "https://yannikheizmann.github.io/wakesmith/"
Repository = "https://github.com/yannikheizmann/wakesmith"
Issues = "https://github.com/yannikheizmann/wakesmith/issues"

[project.scripts]
wakesmith = "wakesmith.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.12"]
docs = ["mkdocs-material>=9.6,<10"]

[tool.uv]
# The CUDA 12.8 wheels cover RTX 30xx, 40xx and 50xx (Blackwell) GPUs.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
# Kokoro's English front end; spaCy models are distributed outside PyPI.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/wakesmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
